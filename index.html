<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TorBox Stream</title>
    <!-- Added to the iPad home screen, it opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TorBox Stream" />
    <meta name="theme-color" content="#0c0f1f" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="rail" aria-label="Main">
      <img class="rail-logo" src="icon.png" alt="TorBox Stream" />
      <a href="#/" data-nav="home" title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
      </a>
      <a href="#/search" data-nav="search" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 5 5" /></svg>
      </a>
      <a href="#/settings" data-nav="settings" title="Settings" aria-label="Settings" class="rail-bottom">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
      </a>
    </nav>
    <main id="view" tabindex="-1"></main>
    <div id="player" class="backdrop" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="search-rank.js"></script>
    <script src="cinemeta.js"></script>
    <script src="scoring.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
